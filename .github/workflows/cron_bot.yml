name: Mojok Telegram Bot Cron

on:
  schedule:
    - cron: '0 9,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from Secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Run Scraper Bot
        run: |
          python notifnupdate.py

      - name: Commit & Push Updated Slugs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add temp_all_slugs.txt
          if git diff --staged --quiet; then
            echo "Tidak ada slug baru."
          else
            git commit -m "chore: update temp_all_slugs.txt [skip ci]"
            git push
          fi
